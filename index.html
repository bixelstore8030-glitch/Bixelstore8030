<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>BIXEL Store</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAyyw14tck0mkhXBmPb5Xh--I4u2cBdhCQ",
  authDomain: "bixel-store-8030-8dc9b.firebaseapp.com",
  projectId: "bixel-store-8030-8dc9b"
};
function sendToTelegram(message){
  fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      chat_id: CHAT_ID,
      text: message
    })
  });
}
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
</script>

<style>
body{
  font-family:tahoma;
  background:linear-gradient(135deg,#050b18,#0b1a33);
  text-align:center;
  margin:0;
  color:#fff;
}

/* العنوان */
h2{
  margin-top:20px;
  color:#4da3ff;
  font-size:26px;
}

/* الكروت */
.box{
  background:rgba(255,255,255,0.06);
  padding:18px;
  margin:15px auto;
  width:92%;
  max-width:420px;
  border-radius:16px;
  border:1px solid rgba(77,163,255,0.2);
  box-shadow:0 8px 25px rgba(0,0,0,0.4);
  backdrop-filter: blur(6px);
}

/* inputs */
input,select{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(0,0,0,0.3);
  color:#fff;
  outline:none;
}

input::placeholder{
  color:#aaa;
}

select{
  cursor:pointer;
}

/* أزرار */
button{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:10px;
  border:none;
  background:linear-gradient(90deg,#1e90ff,#0057ff);
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  transform:scale(1.02);
  background:linear-gradient(90deg,#0d6efd,#003cff);
}

/* الطلبات */
.order{
  border:1px solid rgba(255,255,255,0.1);
  padding:10px;
  margin:8px 0;
  border-radius:10px;
  text-align:right;
  background:rgba(0,0,0,0.25);
}

/* نصوص */
.noOrders{
  color:#aaa;
  font-style:italic;
}

#gameOfferInfo{
  background:rgba(0,0,0,0.25);
  padding:10px;
  border-radius:10px;
  margin-top:6px;
  text-align:right;
  font-size:14px;
  border:1px solid rgba(77,163,255,0.2);
}

#offerNoteDisplay{
  font-size:13px;
  color:#9ecbff;
  margin-top:4px;
  text-align:right;
}

/* روابط */
a{
  color:#4da3ff;
  text-decoration:none;
}

a:hover{
  text-decoration:underline;
}

.hidden{display:none}
</style>
</head>

<body>

<h2>🟢 BIXEL STORE</h2>

<!-- تسجيل الدخول -->
<div class="box" id="loginBox">
  <input id="email" placeholder="الإيميل">
  <input id="pass" type="password" placeholder="كلمة المرور">
  <button onclick="login()">دخول</button>
  <button onclick="showRegister()">إنشاء حساب</button>
</div>

<div class="box hidden" id="registerBox">
  <input id="regEmail" placeholder="الإيميل">
  <input id="regPass" type="password" placeholder="كلمة المرور">
  <button onclick="register()">تسجيل</button>
  <button onclick="hideRegister()">إلغاء</button>
</div>

<!-- عروض المتابعين -->
<div class="box hidden" id="userBox">
  <h3 id="balanceText">الرصيد: 0 BIXEL</h3>

  <button id="toggleUserOffersBtn" class="hidden" onclick="toggleUserOffers()">إخفاء/إظهار عروض المتابعين</button>

  <select id="offer">
    <option value="">اختر العرض</option>
  </select>

  <div id="offerNoteDisplay" class="hidden"></div>

  <input type="number" id="quantity" placeholder="العدد (مضاعف 100)">
  <p id="price"></p>

  <input id="link" placeholder="الرابط">
  <button onclick="sendOrder()">إرسال الطلب</button>
</div>

<!-- شحن الألعاب والبرامج -->
<div class="box hidden" id="gamesBox">
  <h3>🎮 شحن الألعاب والبرامج</h3>

  <select id="gameOffer">
    <option value="">اختر عرض الشحن</option>
  </select>

  <div id="gameOfferInfo" class="hidden"></div>

  <input type="number" id="gameQty" placeholder="العدد">
  <p id="gamePrice"></p>

  <input id="gameAccount" placeholder="ID / Email / رابط الحساب">
  <button onclick="sendGameOrder()">إرسال طلب الشحن</button>
</div>

<!-- الطلبات -->
<div class="box hidden" id="ordersBox">
  <h3>📦 طلباتي</h3>
  <button id="toggleOrdersBtn">عرض طلباتي</button>
  <div id="myOrders" class="hidden"></div>
  <p id="noOrdersMsg" class="noOrders hidden">لا توجد طلبات</p>
</div>

<script>
const BOT_TOKEN = "8657322490:AAE_zjkSd9Wi6ZOraSllsjh6TcgBAwBvkDM";
const CHAT_ID = "6365891219";
let offers = {};
let currentBalance = 0;
let gameOffers = {};
let userOffersVisible = true;

/* ================== نفس الكود بدون تغيير ================== */

function showRegister(){loginBox.classList.add("hidden");registerBox.classList.remove("hidden");}
function hideRegister(){registerBox.classList.add("hidden");loginBox.classList.remove("hidden");}

function register(){
 auth.createUserWithEmailAndPassword(regEmail.value, regPass.value).then(res=>{
   db.collection("users").doc(res.user.uid).set({
     email: regEmail.value,
     bixel:0,
     role:"user"
   });
   alert("تم إنشاء الحساب");
   hideRegister();
 });
}

function login(){
 auth.signInWithEmailAndPassword(email.value, pass.value);
}

auth.onAuthStateChanged(user=>{
 if(!user) return;

 loginBox.classList.add("hidden");
 registerBox.classList.add("hidden");
 userBox.classList.remove("hidden");
 ordersBox.classList.remove("hidden");
 gamesBox.classList.remove("hidden");

 db.collection("settings").doc("userOffers").get().then(doc=>{
   if(doc.exists && doc.data().visible === false){
     toggleUserOffersBtn.classList.remove("hidden");
     hideUserOffers();
   }
 });

 db.collection("offers").onSnapshot(snap=>{
   offer.innerHTML='<option value="">اختر العرض</option>';
   offers={};
   snap.forEach(doc=>{
     offers[doc.id]=doc.data();
     let o=document.createElement("option");
     o.value=doc.id;
     o.textContent=`${doc.data().name} (${doc.data().pricePer100} / 100 BIXEL)`;
     offer.appendChild(o);
   });
 });

 db.collection("game_offers").where("active","==",true)
 .onSnapshot(snap=>{
   gameOffer.innerHTML='<option value="">اختر عرض الشحن</option>';
   gameOffers={};
   snap.forEach(doc=>{
     gameOffers[doc.id]=doc.data();
     let o=document.createElement("option");
     o.value=doc.id;
     o.textContent=`${doc.data().name} (${doc.data().pricePerUnit} BIXEL)`;
     gameOffer.appendChild(o);
   });
 });

 db.collection("users").doc(user.uid).onSnapshot(doc=>{
   currentBalance=doc.data().bixel||0;
   balanceText.innerText="الرصيد: "+currentBalance+" BIXEL";
 });

 loadMyOrders(user.uid);
});

function toggleUserOffers(){
 if(userOffersVisible){ hideUserOffers(); }
 else{ showUserOffers(); }
}

function hideUserOffers(){
 offer.style.display="none";
 quantity.style.display="none";
 link.style.display="none";
 price.style.display="none";
 offerNoteDisplay.style.display="none";
 userOffersVisible=false;
 toggleUserOffersBtn.textContent="إظهار عروض المتابعين";
}

function showUserOffers(){
 offer.style.display="block";
 quantity.style.display="block";
 link.style.display="block";
 price.style.display="block";
 offerNoteDisplay.style.display="block";
 userOffersVisible=true;
 toggleUserOffersBtn.textContent="إخفاء عروض المتابعين";
}

quantity.oninput=calc;
offer.onchange=calc;

function calc(){
 if(!quantity.value||!offer.value){price.innerText=""; offerNoteDisplay.classList.add("hidden"); return;}
 let oData = offers[offer.value];
 let cost=(quantity.value/100)*oData.pricePer100;
 price.innerText="السعر: "+cost+" BIXEL";
 if(oData.note){
   offerNoteDisplay.classList.remove("hidden");
   offerNoteDisplay.innerText="📝 ملاحظات: "+oData.note;
 } else {
   offerNoteDisplay.classList.add("hidden");
 }
}

gameOffer.onchange = calcGame;
gameQty.oninput = calcGame;

function calcGame(){
  if(!gameOffer.value || !gameQty.value){
    gamePrice.innerText = "";
    gameOfferInfo.classList.add("hidden");
    return;
  }

  let o = gameOffers[gameOffer.value];
  let cost = gameQty.value * o.pricePerUnit;

  gamePrice.innerText = "السعر: " + cost + " BIXEL";
  gameOfferInfo.classList.remove("hidden");
  gameOfferInfo.innerHTML = `
    🎮 ${o.name}<br>
    💰 السعر للوحدة: ${o.pricePerUnit} BIXEL<br>
    📝 ${o.note || ""}
  `;
}

function sendOrder(){
 let user=auth.currentUser;
 let q=Number(quantity.value);
 let o=offer.value;
 if(!q||!o||!link.value)return alert("أكمل البيانات");
 let cost=(q/100)*offers[o].pricePer100;
 if(cost>currentBalance)return alert("رصيد غير كاف");

 db.collection("orders").add({
   userId:user.uid,
   email:user.email,
   offer:offers[o].name,
   quantity:q,
   bixelRequired:cost,
   link:link.value,
   note:offers[o].note||"",
   status: "approved",
   createdAt:firebase.firestore.FieldValue.serverTimestamp()
 });
 db.collection("users").doc(user.uid).update({
   bixel: currentBalance - cost
});
 sendToTelegram(
`🟢 طلب جديد BIXEL STORE
📧 المستخدم: ${user.email}
📦 العرض: ${offers[o].name}
🔢 الكمية: ${q}
💰 السعر: ${cost}
🔗 الرابط: ${link.value}`
);
 alert("تم إرسال الطلب");
}

function sendGameOrder(){
  let user = auth.currentUser;

  if(!gameOffer.value || !gameQty.value || !gameAccount.value)
    return alert("أكمل بيانات الشحن");

  let o = gameOffers[gameOffer.value];
  let cost = gameQty.value * o.pricePerUnit;

  if(cost > currentBalance)
    return alert("رصيد غير كاف");

  db.collection("orders").add({
    type: "game_charge",
    userId: user.uid,
    email: user.email,
    offerId: gameOffer.value,
    offerName: o.name,
    quantity: Number(gameQty.value),
    unit: o.unitName,
    bixelRequired: cost,
    account: gameAccount.value,
    status: "approved",
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  db.collection("users").doc(user.uid).update({
    bixel: currentBalance - cost
});
sendToTelegram(
`🎮 طلب شحن جديد
📧 المستخدم: ${user.email}
🎯 العرض: ${o.name}
🔢 الكمية: ${gameQty.value}
💰 السعر: ${cost}
📱 الحساب: ${gameAccount.value}`
);
  alert("تم إرسال طلب الشحن");
}

function loadMyOrders(uid){
 db.collection("orders").where("userId","==",uid)
 .onSnapshot(s=>{
   myOrders.innerHTML="";
   if(s.empty){noOrdersMsg.classList.remove("hidden");}
   else{
     noOrdersMsg.classList.add("hidden");
     s.forEach(d=>{
       let o=d.data();
       if(o.type === "game_charge"){
         myOrders.innerHTML+=`
         <div class="order">
         🎮 ${o.offerName}<br>
         ${o.quantity} ${o.unit} | ${o.bixelRequired} BIXEL<br>
         الحساب: <a href="${o.account}" target="_blank">${o.account}</a><br>
         ${o.status}
         </div>`;
       } else {
         myOrders.innerHTML+=`
         <div class="order">
         ${o.offer}<br>
         ${o.quantity} | ${o.bixelRequired} BIXEL<br>
         الرابط: <a href="${o.link}" target="_blank">${o.link}</a><br>
         📝 ${o.note || "-"}<br>
         ${o.status}
         </div>`;
       }
     });
   }
 });
}

let toggleBtn = document.getElementById("toggleOrdersBtn");
let ordersDiv = document.getElementById("myOrders");

toggleBtn.addEventListener("click", function() {
    if (ordersDiv.classList.contains("hidden")) {
        ordersDiv.classList.remove("hidden");
        toggleBtn.textContent = "إخفاء طلباتي";
    } else {
        ordersDiv.classList.add("hidden");
        toggleBtn.textContent = "عرض طلباتي";
    }
});
</script>

</body>
</html>
